<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Update Pay · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="changepayroll" data-layout="app" data-auth="manager">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main>
    <h1>Update/Set Employee Pay</h1>
    <form id="pay-form" method="post" class="pay-form" novalidate>
      <table>
        <thead><tr><th>Employee Name</th><th>Pay Amount ($/hr)</th></tr></thead>
        <tbody id="pay-rows"></tbody>
      </table>
      <button type="submit">Update Pay</button>
    </form>
    <div id="pay-result" role="status"></div>
  </main>
</body>
</html>
