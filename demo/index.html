<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Home · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="home" data-layout="home">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <header class="remove-margin flex-container" id="nav-divider">
    <div class="image-container">
      <img src="img/BigLogoV1.png" alt="Agile Company logo" width="100">
    </div>
    <div id="nav-bttn" class="flex-container right">
      <button id="darkmode" type="button" data-darkmode>dark mode</button>
      <button class="txt-bttn header-text" type="button" data-href="about.html">about</button>
      <button class="txt-bttn header-text" type="button" data-href="dashboard.html">dashboard</button>
      <button class="login-bttn" type="button" id="auth-button">log-in</button>
    </div>
  </header>

  <main>
    <div id="about">
      <div class="flex-container">
        <div class="left">
          <h1 class="title">Agile Company Time Tracker</h1>
          <h2 class="sub">Clock in, track hours and run payroll for your team</h2>
          <h3 class="sub2">Includes Features</h3>
          <h3>
            <ul>
              <li>clock in</li>
              <li>timesheets</li>
              <li>pay period info</li>
              <li>announcement messages from employer</li>
            </ul>
          </h3>
          <div class="home-cta">
            <button type="button" class="login-bttn" data-href="loginpicker.html">Try the demo</button>
            <button type="button" class="txt-bttn" data-href="about.html">About this project &rarr;</button>
          </div>
        </div>
        <div class="right">
          <img id="main-image" src="img/actt.png" alt="Screens from the Time Tracker wireframe: payroll, pay rates and announcements">
        </div>
      </div>
    </div>
  </main>

</html>
