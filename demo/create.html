<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Create Employee · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="create" data-layout="app" data-auth="manager">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main>
    <section class="create-form">
      <h2>Please Enter your Employee's information</h2>
      <p>Please Note that this will register your employee to your current company as well as create a temporary password using their information</p>
      <div class="signup-container short">
        <form id="create-form" method="post" autocomplete="off" novalidate>
          <input class="signup" type="text" name="name" placeholder="Full name..." aria-label="Employee's full name" maxlength="80">
          <input class="signup" type="email" name="email" placeholder="Email..." aria-label="Employee's email" maxlength="120">
          <input class="signup" type="text" name="company" aria-label="Company" readonly>
          <button class="signup" type="submit">Create</button>
        </form>
      </div>
      <div class="error-signup" id="create-result" role="status"></div>
    </section>
  </main>
</body>
</html>
