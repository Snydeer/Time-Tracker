<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Time Manager · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="timemanager" data-layout="app" data-auth="manager">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main>
    <h1>Time Manager</h1>
    <p id="tm-welcome"></p>
    <form id="tm-form" method="post">
      <div class="center-container">
        <label for="employee_id">Select an Employee:</label>
        <select name="employee_id" id="employee_id"></select>
        <button type="submit">View Time Tracking</button>
      </div>
    </form>
    <div id="tm-results" hidden>
      <h2 id="tm-title"></h2>
      <div class="timesheet-box">
        <table>
          <thead><tr><th>Start Time</th><th>End Time</th><th>Elapsed Time</th></tr></thead>
          <tbody id="tm-rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
