<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Change Password · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="changepassword" data-layout="app" data-auth="any">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main class="changepassword-page">
    <h1>Change Password</h1>
    <form id="password-form" method="post">
      <label for="old_password">Old Password:</label>
      <input type="password" id="old_password" name="old_password" autocomplete="current-password" required><br><br>
      <label for="new_password">New Password:</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" required><br><br>
      <input type="submit" value="Change Password">
    </form>
    <div id="password-result" role="status"></div>
  </main>
</body>
</html>
