<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Log In for Company Manager · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="login" data-layout="app">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main>
    <section class="signup-form">
      <h1>Log In for Company Manager</h1>
      <div class="login-container">
        <form id="login-form" method="post" autocomplete="off" novalidate>
          <input class="login" type="text" name="uid" placeholder="Username..." aria-label="Username">
          <input class="login" type="password" name="pwd" placeholder="Password..." aria-label="Password">
          <button class="login" type="submit">Log In</button>
        </form>
  <div class="demo-creds">
    <p><strong>Demo account</strong></p>
    <p>Username: <code>demomanager</code> · Password: <code>demo1234</code></p>
    <button type="button" id="use-demo">Log in with the demo account</button>
  </div>
      </div>
      <div class="error-login" id="login-error" role="alert"></div>
    </section>
  </main>
</body>
</html>
