<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Sign Up · Time Tracker Demo</title>
  <meta name="description" content="Demo of Agile Company Time Tracker, a PHP and MySQL Software Engineering class project.">
  <link rel="icon" href="img/BigLogoV1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/demo.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="signup" data-layout="app">
  <noscript><p class="noscript">This demo needs JavaScript turned on.</p></noscript>
  <main>
    <section class="signup-form">
      <h2>Sign Up</h2>
      <p>Please Note that this is only for company managers or business owners.</p>
      <p class="hint">This is a demo: your account is saved only in this browser. Please don't use a real password.</p>
      <div class="signup-container">
        <form id="signup-form" method="post" autocomplete="off" novalidate>
          <input class="signup" type="text" name="name" placeholder="Full name..." aria-label="Full name" maxlength="80">
          <input class="signup" type="email" name="email" placeholder="Email..." aria-label="Email" maxlength="120">
          <input class="signup" type="text" name="uid" placeholder="Username..." aria-label="Username" maxlength="40">
          <input class="signup" type="password" name="pwd" placeholder="Password..." aria-label="Password" autocomplete="new-password">
          <input class="signup" type="password" name="pwdrepeat" placeholder="Repeat Password..." aria-label="Repeat password" autocomplete="new-password">
          <input class="signup" type="text" name="companyname" placeholder="Company name..." aria-label="Company name" maxlength="80">
          <button class="signup" type="submit">Sign Up</button>
        </form>
      </div>
      <div class="error-signup" id="signup-error" role="alert"></div>
    </section>
  </main>
</body>
</html>
